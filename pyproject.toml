[project]
name = "applyflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mounsef27", email = "monsaf.debbache@g.enp.edu.dz" }
]
requires-python = ">=3.13"
dependencies = [
    "duckduckgo-search>=8.1.1",
    "email-validator>=2.3.0",
    "langchain>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.4",
    "langchain-ollama>=1.1.0",
    "langchainhub>=0.1.21",
    "langgraph>=1.2.19",
    "playwright>=1.64.1",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily-python>=0.8.5",
]

[project.scripts]
applyflow = "applyflow:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.applyflow]
ollama_model = "qwen3:1.7b"
ollama_base_url = "http://localhost:11434"
