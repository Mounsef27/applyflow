[project]
name = "applyflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mounsef27", email = "monsaf.debbache@g.enp.edu.dz" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "email-validator>=2.4.0",
    "fastapi>=0.163.2",
    "langchain-anthropic>=1.7.11",
    "langchain-core>=1.8.1",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.2.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.1",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
applyflow = "applyflow:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
